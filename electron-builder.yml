appId: local.duckbook.desktop
productName: Duckbook
directories:
  output: release
files:
  - desktop-dist/**
  - dist/**
  - package.json
  - '!node_modules/**'
asar: true
npmRebuild: false
win:
  target: nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
