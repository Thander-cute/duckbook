name: Idea or request
description: Suggest something Duckbook could do
labels: [idea]
body:
  - type: markdown
    attributes:
      value: Duckbook tries to stay a quiet paper notebook, so not every good idea fits. Explaining the need helps more than a finished design.
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The situation, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself once we agree on it
